[start]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/apply.sh
parameters:
type:script_output
message:Applying CARP failover helpers

[reload]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/apply.sh
parameters:
type:script_output
message:Applying CARP failover helpers

[restart]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/apply.sh
parameters:
type:script_output
message:Applying CARP failover helpers
description:Apply CARP failover helpers

[stop]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/stop.sh
parameters:
type:script_output
message:Stopping CARP failover helpers

[status]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/service_status.sh
parameters:
type:script_output
message:Requesting CARP failover helpers status

[show]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/status.sh
parameters:
type:script_output
message:Requesting CARP failover helpers state

[showkv]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/status.sh --kv
parameters:
type:script_output
message:Requesting CARP failover helpers state

[settings]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/status.sh --settings
parameters:
type:script_output
message:Requesting CARP failover helpers settings

[egress]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/egress.sh
parameters:
type:script_output
message:Reconciling default route and backup egress

[routes.show]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/egress.sh --show
parameters:
type:script_output
message:Requesting default route and backup egress state

[routes.dryrun]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/egress.sh --dry-run
parameters:
type:script_output
message:Listing the route changes the helpers would make

[services.apply]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/master_services.sh
parameters:
type:script
message:Reconciling master-only services

[services.dryrun]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/master_services.sh --dry-run
parameters:
type:script_output
message:Listing the master-only service changes the helpers would make

[tailscale.dryrun]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/tailscale_primary.sh --dry-run
parameters:
type:script_output
message:Listing the Tailscale handover decision

[dns.dryrun]
command:/usr/local/opnsense/scripts/OPNsense/HaHelpers/unbound_master.sh --dry-run
parameters:
type:script_output
message:Listing what a takeover would do to Unbound
