{#
 # Shell settings for the scripts in /usr/local/opnsense/scripts/OPNsense/HaHelpers,
 # rendered from OPNsense.HaHelpers. Every value has passed the model's masks
 # (digits, names, address patterns), so it is safe inside double quotes.
 #}
# Generated by configd from the ha-helpers settings; edit them in the GUI.
{% set g = helpers.getNodeByTag('OPNsense.HaHelpers.general') or {} %}
{% set l = helpers.getNodeByTag('OPNsense.HaHelpers.local') or {} %}
{% if g.enabled|default('0', true) == '1' %}
VHID="{{ g.vhid|default('', true) }}"
{% else %}
VHID=""
{% endif %}
BOOT_GRACE="{{ g.bootGrace|default('120', true) }}"
MASTER_ONLY_SERVICES="{{ g.masterOnlyServices|default('', true)|replace(',', ' ') }}"
SERVICE_SETTLE="{{ g.serviceSettle|default('1', true) }}"
BACKUP_EGRESS="{{ 'yes' if g.backupEgress|default('1', true) == '1' else 'no' }}"
PIN_DEFAULT_ROUTE="{{ 'yes' if g.pinDefaultRoute|default('1', true) == '1' else 'no' }}"
UNUSABLE_DEFAULT_GWS="{{ g.unusableDefaultGws|default('10.*,192.168.*,172.1[6-9].*,172.2[0-9].*,172.3[01].*,169.254.*', true)|replace(',', ' ') }}"
GW_PING_TIMEOUT_MS="{{ g.gwPingTimeout|default('700', true) }}"
PEER_PING_TIMEOUT_MS="{{ g.peerPingTimeout|default('500', true) }}"
UNBOUND_RESTART_ON_MASTER="{{ 'yes' if g.unboundRestart|default('1', true) == '1' else 'no' }}"
DNS_CHECK_NAME="{{ g.dnsCheckName|default('opnsense.org', true) }}"
DNS_CHECK_SERVER="{{ g.dnsCheckServer|default('127.0.0.1', true) }}"
DNS_RESTART_TRIES="{{ g.dnsRestartTries|default('2', true) }}"
DNS_SETTLE="{{ g.dnsSettle|default('4', true) }}"
DNS_RETRY_WAIT="{{ g.dnsRetryWait|default('3', true) }}"
PFSYNC_MAXUPD="{{ '' if g.pfsyncMaxupd|default('8', true) == '0' else g.pfsyncMaxupd|default('8', true) }}"
EGRESS_HOOK_DELAY="{{ g.egressHookDelay|default('2', true) }}"
SERVICES_HOOK_DELAY="{{ g.servicesHookDelay|default('3', true) }}"
SERVICES_BOOT_DELAY="{{ g.servicesBootDelay|default('15', true) }}"
LOCK_TIMEOUT="{{ g.lockTimeout|default('30', true) }}"
TAILSCALE_NODES="{{ g.tailscaleNodes|default('', true)|replace(',', ' ') }}"
TAILSCALE_HANDOVER_HOLD="{{ g.tailscaleHandoverHold|default('45', true) }}"
JUMBO_MTU_IFS="{{ l.jumboMtuInterfaces|default('', true)|replace(',', ' ') }}"
JUMBO_MTU="{{ l.jumboMtu|default('9000', true) }}"
